# gosftpd configuration reference (`gosftpd config example --full`), schema v1.
# Every key with its default value. Unknown keys are an error.
# This is a reference, not a working config: the paths below must exist
# (or set create = true). Check with: gosftpd config validate --check-fs
config_version = 1

# Extra files with [users.NAME] tables only, relative to this file.
include = ["users.d/*.toml"]

[server]
listen = [":2022"]                      # IPv4 and IPv6 (dual stack)
host_keys = ["/var/lib/gosftpd/ssh_host_ed25519_key"]
host_key_auto_generate = true           # create a missing key as ed25519 (0600)
crypto_policy = "modern"                # modern | compat (adds NIST curves, DH and non-ETM MACs)
handshake_timeout = "30s"
idle_timeout = "15m"                    # no SFTP data for this long closes the connection; "0s" = off
keepalive_interval = "30s"              # 3 unanswered keepalives close the connection; "0s" = off
shutdown_timeout = "30s"                # keep below systemd TimeoutStopSec / Docker stop_grace_period

[limits]                                # connections over a limit are closed before the handshake
max_connections = 256
max_connections_per_ip = 16             # per IPv4 address or IPv6 /64
max_preauth_connections = 64            # not logged in yet
max_sessions_per_conn = 4
max_open_handles = 64                   # per SFTP session
max_auth_tries = 6

[auth]
methods = ["publickey"]                 # add "password" for users with password_hash
# SSH certificates: CAs trusted for every user (a certificate logs in as a
# user whose principals it carries), and revoked keys and certificates.
trusted_user_ca_keys = []               # e.g. ["ssh-ed25519 AAAA... corp-ca"]
trusted_user_ca_keys_file = ""          # a file of CA public keys, one per line
revoked_keys = []                       # keys or certificates; a certificate revokes its key
revoked_keys_file = ""                  # read again on reload; an invalid file fails the reload

[auth.ban]                              # per IPv4 address or IPv6 /64: each wrong password, rejected keys once per connection
after_failures = 10                     # 0 = no bans
within = "10m"
duration = "30m"
exempt = ["127.0.0.0/8", "::1/128"]

[defaults]                              # inherited by every mount
on_conflict = "rename"                  # rename | reject | overwrite | version
rename_template = "{stem} ({n}){ext}"   # must contain {n}
max_rename_attempts = 100               # then {n} becomes a UTC timestamp
compound_extensions = [".tar.gz", ".tar.bz2", ".tar.xz", ".tar.zst"]
flatten = true                          # a user's only mount is served as /
setstat_mode = "times"                  # times | ignore | deny
umask = "0027"                          # octal string: files 0640, directories 0750
require_mountpoint = false              # true: refuse to start unless the path is a mount point
resume = "append-only"                  # append-only | off: continue uploads, never change existing bytes
stat_redirect = true                    # after a renamed upload, STAT of the requested name shows the copy
symlinks = "inside-only"                # inside-only | deny: follow existing links that stay in the mount
max_file_size = "0"                     # "0" = no limit; e.g. "10GiB"
min_free_space = "1GiB"                 # refuse new writes below this free space; "0" = off
atomic_uploads = false                  # true: temp file, named on close; no resume
fsync = false                           # flush before naming (atomic_uploads, version)
versions = { dir = ".versions", keep = 10, max_age = "720h" }   # for on_conflict = "version"

[mounts.public]
path = "/srv/sftp/public"
read_only = true

[mounts.inbox]
path = "/srv/sftp/inbox"
create = true
on_conflict = "rename"
atomic_uploads = true                   # no partial files under their names
max_file_size = "10GiB"

[mounts.home]
path = "/srv/sftp/home/{user}"          # one directory per user, created as 0750
create = true
on_conflict = "version"                 # a new upload keeps the old file in .versions
versions = { keep = 5 }

# Permissions: read (list, read), upload (list, write, mkdir),
# readwrite (list, read, write, overwrite, rename, mkdir, setstat), full,
# or a list of flags such as "list,write".
[users.alice]
authorized_keys = ["<paste alice's public key>"]
authorized_keys_file = "/etc/gosftpd/keys/alice.pub"
allow_from = ["10.0.0.0/8", "192.168.0.0/16"]
# principals = ["alice", "alice@corp.example"]  # with trusted CAs: names her certificates may carry; default: the user name
access = { public = "read", inbox = "upload", home = "full" }

[users.partner-acme]
authorized_keys = ["<paste the partner's public key>"]
password_hash = ""                      # from 'gosftpd user hash-password'; needs "password" in auth.methods
expires = 2026-12-31T23:59:59Z
disabled = false
access = { inbox = "list,write" }

[log]
level = "info"                          # debug | info | warn | error
format = "text"                         # text | json

[audit]
output = "/var/log/gosftpd/audit.jsonl" # or "stdout"
events = ["conn", "auth", "session", "transfer", "modify", "denied"]  # also: list, stat; server is always on
on_error = "fail-closed"                # fail-closed: refuse uploads and logins while the log cannot be written; fail-open

# kill -HUP (systemctl reload) applies this file again without a restart.
[reload]
disconnect_removed_users = false        # true: close connections whose login the new configuration refuses
