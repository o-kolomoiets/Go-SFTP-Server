# Drop-in for systemd without Type=notify-reload (upstream before 253, such
# as Debian 12 and Ubuntu 22.04; EL9 before 252-21). Install it as
# /etc/systemd/system/gosftpd.service.d/legacy-notify.conf only where this
# offline probe prints "Failed to parse service type" (it needs no running
# systemd and does not read this drop-in):
#
#   d=$(mktemp -d)
#   printf '[Unit]\nDefaultDependencies=no\n[Service]\nType=notify-reload\nExecStart=/bin/true\n' >"$d/gosftpd-probe.service"
#   systemd-analyze verify --man=no "$d/gosftpd-probe.service"
#   rm -r "$d"
#
# Remove it once systemd is upgraded. With it, systemctl reload can in rare
# cases return before the reload has finished.
[Service]
Type=notify
ExecReload=/bin/kill -HUP $MAINPID
