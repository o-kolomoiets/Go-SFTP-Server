# needrestart (Ubuntu) restarts every service that runs a replaced binary
# after an apt run, also unattended-upgrades'. gosftpd is not restarted:
# a restart ends every session, and the operator restarts it after an
# upgrade (systemctl restart gosftpd). Delete or edit this file to let
# needrestart restart it. Installed by the gosftpd deb as
# /etc/needrestart/conf.d/gosftpd.conf (ADR 0012).
$nrconf{override_rc}{qr(^gosftpd\.service$)} = 0;
