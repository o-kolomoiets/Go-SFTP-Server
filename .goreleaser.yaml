# GoReleaser v2.19.0 configuration (ADR 0012): archives for Linux, macOS and
# FreeBSD with their SBOMs, deb, rpm and Arch packages, checksums.txt and its
# signature, the signed image ghcr.io/o-kolomoiets/gosftpd and a draft
# GitHub release. Windows follows once the isolation tests pass there (M3b).
# Check with: goreleaser check && goreleaser release --snapshot --clean
# --skip=sign (the SBOMs need syft, the image Docker with buildx; without
# them add sbom and docker to --skip).
version: 2
project_name: gosftpd

# CI and local snapshots run the hooks; release.yml runs the same two
# commands in its generate job, without credentials, and passes
# --skip=before (ADR 0012).
before:
  hooks:
    - go mod tidy -diff
    # Man pages, completions and THIRD_PARTY_LICENSES into out/ (ignored by
    # git), and the empty directories the image copies (ADR 0012).
    - make generate

# Linux apart, so that only the Linux archives carry the packaging files
# (ADR 0011). -trimpath and mod_timestamp make the binaries reproducible.
builds:
  - &build
    id: gosftpd
    main: ./cmd/gosftpd
    binary: gosftpd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/o-kolomoiets/go-sftp-server/internal/version.Version={{ .Tag }}
      - -X github.com/o-kolomoiets/go-sftp-server/internal/version.Commit={{ .FullCommit }}
      - -X github.com/o-kolomoiets/go-sftp-server/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  # FreeBSD is Tier 2: cross-built and not tested (ROADMAP §9.4).
  - <<: *build
    id: gosftpd-other
    goos: [darwin, freebsd]

# Every entry has a fixed owner, group, mode and time, so that an archive
# does not depend on the checkout: with only the time fixed, a checkout made
# under umask 002 changed every archive (ADR 0012). The files under out/
# come from make generate. A missing THIRD_PARTY_LICENSES fails the build,
# a pattern that matches nothing does not: goreleaser-check lists the
# archives.
archives:
  # The packaging files in the layout docs/install.md installs them from.
  - id: gosftpd
    ids: [gosftpd]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: { owner: root, group: root, mode: 0755, mtime: "{{ .CommitDate }}" }
    files:
      - { src: LICENSE, info: &info { owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}" } }
      - { src: README.md, info: *info }
      - { src: CHANGELOG.md, info: *info }
      - { src: out/THIRD_PARTY_LICENSES, strip_parent: true, info: *info }
      - { src: "out/man/*.1.gz", dst: man, strip_parent: true, info: *info }
      - { src: "out/completions/*", dst: completions, strip_parent: true, info: *info }
      - { src: packaging/config.toml, info: *info }
      - { src: packaging/gosftpd.sysusers, info: *info }
      - { src: packaging/gosftpd.tmpfiles, info: *info }
      - { src: packaging/systemd/gosftpd.service, info: *info }
      - { src: packaging/systemd/legacy-notify.conf, info: *info }
  - id: gosftpd-other
    ids: [gosftpd-other]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: { owner: root, group: root, mode: 0755, mtime: "{{ .CommitDate }}" }
    files: # the first six entries of the Linux archive
      - { src: LICENSE, info: *info }
      - { src: README.md, info: *info }
      - { src: CHANGELOG.md, info: *info }
      - { src: out/THIRD_PARTY_LICENSES, strip_parent: true, info: *info }
      - { src: "out/man/*.1.gz", dst: man, strip_parent: true, info: *info }
      - { src: "out/completions/*", dst: completions, strip_parent: true, info: *info }

checksum: { name_template: checksums.txt, algorithm: sha256 }

# One SPDX JSON per archive, written by syft with GoReleaser's default
# arguments (--enrich all goes online); checksums.txt lists them.
sboms:
  - artifacts: archive

# Keyless cosign through GitHub's OIDC token in release.yml: the Sigstore
# bundle checksums.txt.sigstore.json signs checksums.txt, which lists every
# archive, package and SBOM. Snapshot mode skips publishing, not signing:
# CI and local snapshots pass --skip=sign.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

# deb, rpm and Arch packages of the Linux build: the files of the Linux
# archive in the layout docs/install.md gives, and the documentation. No
# apk: Alpine has no systemd (ADR 0012). Every entry has a fixed mode and
# time, and owner and group root; postinstall gives config.toml and
# users.d to the group gosftpd, which does not exist when the package is
# unpacked. The scripts never enable, start or restart the service.
nfpms:
  - id: packages
    ids: [gosftpd]
    package_name: gosftpd
    formats: [deb, rpm, archlinux]
    maintainer: gosftpd maintainers # no email address (ADR 0012)
    vendor: gosftpd
    homepage: https://github.com/o-kolomoiets/go-sftp-server
    license: Apache-2.0
    description: SFTP drop-box server with an audit log
    section: net
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      - { src: packaging/systemd/gosftpd.service, dst: /usr/lib/systemd/system/gosftpd.service, file_info: &pinfo { mode: 0644, mtime: "{{ .CommitDate }}" } }
      - { src: packaging/gosftpd.sysusers, dst: /usr/lib/sysusers.d/gosftpd.conf, file_info: *pinfo }
      - { src: packaging/gosftpd.tmpfiles, dst: /usr/lib/tmpfiles.d/gosftpd.conf, file_info: *pinfo }
      # The template postinstall copies where systemd lacks Type=notify-reload.
      - { src: packaging/systemd/legacy-notify.conf, dst: /usr/share/gosftpd/legacy-notify.conf, file_info: *pinfo }
      # A conffile in deb, %config(noreplace) in rpm, backup in Arch.
      - { src: packaging/config.toml, dst: /etc/gosftpd/config.toml, type: "config|noreplace", file_info: { mode: 0640, mtime: "{{ .CommitDate }}" } }
      # The include directory exists at the first start, so that under
      # Landlock the first user add --write needs only a reload.
      - { dst: /etc/gosftpd/users.d, type: dir, file_info: { mode: 0750, mtime: "{{ .CommitDate }}" } }
      # The package's own directories: rpm owns, and removes once empty,
      # only those listed (deb and Arch list every parent directory).
      - { dst: /etc/gosftpd, type: dir, file_info: &dinfo { mode: 0755, mtime: "{{ .CommitDate }}" } }
      - { dst: /usr/share/gosftpd, type: dir, file_info: *dinfo }
      - { dst: /usr/share/doc/gosftpd, type: dir, file_info: *dinfo }
      # needrestart would restart gosftpd after an apt run (Ubuntu).
      - { src: packaging/needrestart.conf, dst: /etc/needrestart/conf.d/gosftpd.conf, type: "config|noreplace", packager: deb, file_info: *pinfo }
      - { src: internal/config/example-full.toml, dst: /usr/share/doc/gosftpd/config.example.toml, file_info: *pinfo }
      - { src: LICENSE, dst: /usr/share/doc/gosftpd/LICENSE, file_info: *pinfo }
      - { src: out/THIRD_PARTY_LICENSES, dst: /usr/share/doc/gosftpd/THIRD_PARTY_LICENSES, file_info: *pinfo }
      - { src: "out/man/*.1.gz", dst: /usr/share/man/man1/, file_info: *pinfo }
      - { src: out/completions/gosftpd.bash, dst: /usr/share/bash-completion/completions/gosftpd, file_info: *pinfo }
      - { src: out/completions/gosftpd.fish, dst: /usr/share/fish/vendor_completions.d/gosftpd.fish, file_info: *pinfo }
      - { src: out/completions/_gosftpd, dst: /usr/share/zsh/vendor-completions/_gosftpd, packager: deb, file_info: *pinfo }
      - { src: out/completions/_gosftpd, dst: /usr/share/zsh/site-functions/_gosftpd, packager: rpm, file_info: *pinfo }
      - { src: out/completions/_gosftpd, dst: /usr/share/zsh/site-functions/_gosftpd, packager: archlinux, file_info: *pinfo }
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    archlinux:
      packager: gosftpd maintainers
      scripts:
        postupgrade: packaging/scripts/postinstall.sh # pacman runs post_upgrade, not post_install, on an upgrade
    rpm:
      buildhost: gosftpd # nfpm takes the host name otherwise
    overrides:
      deb:
        # legacy-notify.conf reloads with /bin/kill, which a minimal Debian
        # 12 lacks.
        dependencies: [procps]
      archlinux:
        # nfpm v2.48.0 puts the pre-release into an Arch pkgver only with an
        # epoch: without one v0.5.0-rc.1 would be 0.5.0-1, the final's. Epoch
        # 0 is what pacman assumes without one: 0:0.5.0rc.1-1 sorts below
        # 0:0.5.0-1.
        epoch: "0"

# linux/amd64 and linux/arm64 from packaging/docker/Dockerfile, which copies
# the Linux binary and the empty directories make generate creates. Only
# the version tag: release.yml points latest at a stable version once its
# verification step has passed. A snapshot builds one image per platform
# and appends the architecture: v<version>-amd64 and -arm64.
dockers_v2:
  - id: image
    ids: [gosftpd]
    dockerfile: packaging/docker/Dockerfile
    extra_files: [out/docker]
    images: [ghcr.io/o-kolomoiets/gosftpd]
    tags: ["v{{ .Version }}"]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/o-kolomoiets/Go-SFTP-Server
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: Apache-2.0

# The pushed image index, signed by digest, keyless like checksums.txt (the
# default arguments use --key=cosign.key). Not in a snapshot, which pushes
# nothing.
docker_signs:
  - cmd: cosign
    args: [sign, "${artifact}@${digest}", --yes]

# dist/digests.txt: "<hex>  ghcr.io/o-kolomoiets/gosftpd:<tag>" per pushed
# tag, the digest users verify and run (docs/install.md). Not in a snapshot.
docker_digest: { name_template: digests.txt }

# Local and snapshot runs: v0.5.0 before v0.5.0-rc.1 on one commit (git's
# version sort ranks the rc higher).
git: { prerelease_suffix: "-" }

# A draft, which the owner publishes once it is complete and checked
# (ADR 0012). Its notes are the version's section of CHANGELOG.md, given
# with --release-notes: .github/scripts/release-notes.sh VERSION writes it.
release:
  draft: true
  replace_existing_draft: true # a re-run replaces its own draft
  prerelease: auto
  preflight: { fail_on_error: true } # an immutable release stops the run before the build

# No changelog.disable: GoReleaser reads --release-notes in its changelog
# step, which disable skips, so the draft would get no notes. Without the
# flag that step writes a list of commits to dist/CHANGELOG.md and uses it
# as the notes.
