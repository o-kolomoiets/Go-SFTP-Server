version: 2
updates:
  - package-ecosystem: gomod
    # tools/go.mod is a separate module; without it Dependabot ignores the tools.
    directories: ["/", "/tools"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
