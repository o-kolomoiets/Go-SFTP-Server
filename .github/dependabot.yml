version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # tools/go.mod is a separate module. The tool directive leaves every
  # requirement there marked "// indirect", and Dependabot updates only
  # direct dependencies by default, so allow all of them.
  - package-ecosystem: gomod
    directory: /tools
    allow:
      - dependency-type: all
    ignore:
      # actionlint v1.7.12 does not build with go.yaml.in/yaml/v4
      # v4.0.0-rc.4 or newer; it requires rc.3. An actionlint update
      # raises it as far as that release needs.
      - dependency-name: go.yaml.in/yaml/v4
    schedule:
      interval: weekly
    groups:
      tools:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  # The base image's digest in packaging/docker/Dockerfile and the digests
  # every FROM of test/packages/*.Dockerfile is pinned by (ADR 0012).
  # test/docker/ holds scripts, no Dockerfile.
  - package-ecosystem: docker
    directories: [/packaging/docker, /test/packages]
    ignore:
      # debian-12.Dockerfile and el9.Dockerfile test those releases (the
      # packages job's Debian 12 is its only systemd before 253): only
      # their digests are updated, never their major version. Another
      # release gets a Dockerfile and a matrix entry of its own.
      - dependency-name: debian
        update-types: ["version-update:semver-major"]
      - dependency-name: rockylinux/rockylinux
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
