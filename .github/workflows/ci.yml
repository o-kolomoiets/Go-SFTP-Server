name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        run: |
          go mod tidy -diff
          cd tools && go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: actionlint
        run: go tool -modfile=tools/go.mod actionlint
      - name: FreeBSD cross-build (Tier 2)
        run: GOOS=freebsd go vet ./... && GOOS=freebsd go build ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race -shuffle=on -count=1 ./...
      - name: go test
        if: runner.os == 'Windows'
        run: go test -shuffle=on -count=1 ./...

  min-go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./... && go vet ./...

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          check-latest: true

  # The only required status check: matrix jobs report as "test (…)",
  # so branch protection cannot require them by a stable name.
  ci-ok:
    if: always()
    needs: [lint, test, min-go, vuln]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed"
