name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        run: |
          go mod tidy -diff
          cd tools && go mod tidy -diff
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: actionlint
        run: go tool -modfile=tools/go.mod actionlint
      - name: FreeBSD cross-build (Tier 2)
        run: GOOS=freebsd go vet ./... && GOOS=freebsd go build ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    env:
      # One cell records coverage for the floors (job coverage, ROADMAP §8.5).
      COVERAGE: ${{ matrix.os == 'ubuntu-24.04' && matrix.go == '1.27.x' && 'true' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: go test -race
        if: runner.os != 'Windows' && !env.COVERAGE
        run: go test -race -shuffle=on -count=1 ./...
      - name: go test -race with coverage
        if: env.COVERAGE
        run: |
          mkdir -p coverage/unit
          go test -race -shuffle=on -count=1 -cover -coverpkg=./... ./... -args -test.gocoverdir="$PWD/coverage/unit"
      - name: go test
        if: runner.os == 'Windows'
        run: go test -shuffle=on -count=1 ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.COVERAGE
        with:
          name: coverage-unit
          path: coverage/unit
          retention-days: 7

  min-go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./... && go vet ./...

  interop:
    name: interop (OpenSSH ${{ matrix.openssh }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - openssh: system # 9.6p1 on ubuntu-24.04, plus paramiko, rclone and lftp
            clients: true
          - openssh: V_10_6_P1 # built from source
    runs-on: ubuntu-24.04
    env:
      # Not RCLONE_*: rclone reads those as flags.
      CLIENT_PARAMIKO_VERSION: 5.0.0
      CLIENT_RCLONE_VERSION: v1.75.0
      CLIENT_RCLONE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Build OpenSSH ${{ matrix.openssh }}
        if: matrix.openssh != 'system'
        env:
          TAG: ${{ matrix.openssh }}
        run: |
          sudo apt-get install -y -q autoconf libssl-dev zlib1g-dev
          git clone -q --depth 1 --branch "$TAG" https://github.com/openssh/openssh-portable.git "$RUNNER_TEMP/openssh"
          cd "$RUNNER_TEMP/openssh"
          autoreconf -i
          ./configure -q --prefix="$RUNNER_TEMP/openssh-bin"
          make -j"$(nproc)" ssh sftp scp ssh-keygen
          mkdir -p "$RUNNER_TEMP/openssh-bin/bin"
          cp ssh sftp scp ssh-keygen "$RUNNER_TEMP/openssh-bin/bin/"
          echo "$RUNNER_TEMP/openssh-bin/bin" >> "$GITHUB_PATH"
      - name: Install paramiko, rclone and lftp
        if: matrix.clients
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lftp
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "paramiko==$CLIENT_PARAMIKO_VERSION"
          curl -fsSLo "$RUNNER_TEMP/rclone.zip" \
            "https://github.com/rclone/rclone/releases/download/$CLIENT_RCLONE_VERSION/rclone-$CLIENT_RCLONE_VERSION-linux-amd64.zip"
          echo "$CLIENT_RCLONE_SHA256  $RUNNER_TEMP/rclone.zip" | sha256sum -c -
          unzip -q -j "$RUNNER_TEMP/rclone.zip" "*/rclone" -d "$RUNNER_TEMP/bin"
          {
            echo "PYTHON=$RUNNER_TEMP/venv/bin/python"
            echo "RCLONE=$RUNNER_TEMP/bin/rclone"
            echo "REQUIRE_CLIENTS=1"
          } >> "$GITHUB_ENV"
      - name: Clients against gosftpd
        run: |
          ssh -V
          if [ -n "$RECORD_COVERAGE" ]; then
            mkdir -p coverage/e2e
            export GOCOVERDIR="$PWD/coverage/e2e"
          fi
          test/interop/run.sh
        env:
          RECORD_COVERAGE: ${{ matrix.clients && 'true' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.clients
        with:
          name: coverage-e2e
          path: coverage/e2e
          retention-days: 7

  coverage:
    needs: [test, interop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
      - name: Coverage floors of the security packages
        run: test/coverage.sh coverage/coverage-unit coverage/coverage-e2e

  ssh-audit:
    runs-on: ubuntu-24.04
    env:
      SSH_AUDIT_VERSION: 3.9.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Install ssh-audit
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "ssh-audit==$SSH_AUDIT_VERSION"
      - name: modern has no failure, compat only the documented ones
        run: test/ssh-audit.sh "$RUNNER_TEMP/venv/bin/ssh-audit"

  fuzz-smoke:
    name: fuzz-smoke (${{ matrix.fn }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/vfs, fn: FuzzResolve }
          - { pkg: ./internal/vfs, fn: FuzzResolveInRoot }
          - { pkg: ./internal/vfs, fn: FuzzConflictName }
          - { pkg: ./internal/config, fn: FuzzParseConfig }
          - { pkg: ./internal/auth, fn: FuzzAuthorizedKeys }
          - { pkg: ./internal/sftpd, fn: FuzzRequestServer }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Fuzz for 60 seconds
        env:
          PKG: ${{ matrix.pkg }}
          FN: ${{ matrix.fn }}
        # -race: the request server target looks for data races too.
        run: go test -race -run='^$' -fuzz="^${FN}\$" -fuzztime=60s -fuzzminimizetime=10s "$PKG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.fn }}
          path: "**/testdata/fuzz/${{ matrix.fn }}"

  goreleaser-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --snapshot --clean
      - name: The Linux binary runs and reports its version
        run: |
          ./dist/gosftpd_linux_amd64_v1/gosftpd version

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          check-latest: true

  # The only required status check: matrix jobs report as "test (…)",
  # so branch protection cannot require them by a stable name.
  ci-ok:
    if: always()
    needs: [lint, test, min-go, interop, coverage, ssh-audit, fuzz-smoke, goreleaser-check, vuln]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed"
