name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        run: |
          go mod tidy -diff
          cd tools && go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: actionlint
        run: go tool -modfile=tools/go.mod actionlint
      - name: FreeBSD cross-build (Tier 2)
        run: GOOS=freebsd go vet ./... && GOOS=freebsd go build ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race -shuffle=on -count=1 ./...
      - name: go test
        if: runner.os == 'Windows'
        run: go test -shuffle=on -count=1 ./...

  min-go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./... && go vet ./...

  interop:
    name: interop (OpenSSH ${{ matrix.openssh }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - openssh: system # 9.6p1 on ubuntu-24.04, plus paramiko, rclone and lftp
            clients: true
          - openssh: V_10_6_P1 # built from source
    runs-on: ubuntu-24.04
    env:
      # Not RCLONE_*: rclone reads those as flags.
      CLIENT_PARAMIKO_VERSION: 5.0.0
      CLIENT_RCLONE_VERSION: v1.75.0
      CLIENT_RCLONE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Build OpenSSH ${{ matrix.openssh }}
        if: matrix.openssh != 'system'
        env:
          TAG: ${{ matrix.openssh }}
        run: |
          sudo apt-get install -y -q autoconf libssl-dev zlib1g-dev
          git clone -q --depth 1 --branch "$TAG" https://github.com/openssh/openssh-portable.git "$RUNNER_TEMP/openssh"
          cd "$RUNNER_TEMP/openssh"
          autoreconf -i
          ./configure -q --prefix="$RUNNER_TEMP/openssh-bin"
          make -j"$(nproc)" ssh sftp scp ssh-keygen
          mkdir -p "$RUNNER_TEMP/openssh-bin/bin"
          cp ssh sftp scp ssh-keygen "$RUNNER_TEMP/openssh-bin/bin/"
          echo "$RUNNER_TEMP/openssh-bin/bin" >> "$GITHUB_PATH"
      - name: Install paramiko, rclone and lftp
        if: matrix.clients
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lftp
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "paramiko==$CLIENT_PARAMIKO_VERSION"
          curl -fsSLo "$RUNNER_TEMP/rclone.zip" \
            "https://github.com/rclone/rclone/releases/download/$CLIENT_RCLONE_VERSION/rclone-$CLIENT_RCLONE_VERSION-linux-amd64.zip"
          echo "$CLIENT_RCLONE_SHA256  $RUNNER_TEMP/rclone.zip" | sha256sum -c -
          unzip -q -j "$RUNNER_TEMP/rclone.zip" "*/rclone" -d "$RUNNER_TEMP/bin"
          {
            echo "PYTHON=$RUNNER_TEMP/venv/bin/python"
            echo "RCLONE=$RUNNER_TEMP/bin/rclone"
            echo "REQUIRE_CLIENTS=1"
          } >> "$GITHUB_ENV"
      - name: Clients against gosftpd
        run: |
          ssh -V
          test/interop/run.sh

  goreleaser-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --snapshot --clean
      - name: The Linux binary runs and reports its version
        run: |
          ./dist/gosftpd_linux_amd64_v1/gosftpd version

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          check-latest: true

  # The only required status check: matrix jobs report as "test (…)",
  # so branch protection cannot require them by a stable name.
  ci-ok:
    if: always()
    needs: [lint, test, min-go, interop, goreleaser-check, vuln]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed"
