name: Release

# Builds, signs and attests a release as a draft, which the owner publishes
# once this run is green (ADR 0012, docs/release-checklist.md). It runs on a
# tag's ref: tag.yml starts it after creating the tag, or the owner does for
# a tag made another way (gh workflow run release.yml --ref vX.Y.Z). There
# is no push trigger, and the guard in every job runs only the highest
# release tag whose release is not published yet.
on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, whatever the tag, and none cancelled while it runs: a
# run dispatched during another waits, and its guard then sees the other
# run's tag. Runs for two tags would otherwise overlap, and the older one
# could move latest last.
concurrency:
  group: release

jobs:
  # The guard, then the man pages, completions and THIRD_PARTY_LICENSES from
  # make generate: go generate and go-licenses are third-party code, which
  # never runs next to the release credentials.
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      # The Go that every gosftpd of the release is built with: the other
      # jobs set up exactly this version, also when re-run alone (ADR 0013).
      go-version: ${{ steps.go.outputs.version }}
      # The artifact by its id, which the release job downloads: an artifact
      # that another job of the run deleted and uploaded again under its
      # name has another id.
      out-artifact-id: ${{ steps.out.outputs.artifact-id }}
    steps:
      # Pinned to commits, as everywhere; Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-guard.sh
      # No Actions cache where a release is built: a cache written by a CI
      # job on main would be built into the release (ADR 0012).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      # Before any third-party code runs: the version setup-go resolved,
      # with its patch release (setup-go would read 1.27 as a range).
      - id: go
        name: The Go version
        run: |
          version=$(go env GOVERSION)
          version=${version#go}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::go env GOVERSION: $version"; exit 1; fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: make generate
        run: go mod tidy -diff && make generate
      # Their common root, out/, is the artifact's root.
      - id: out
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: |
            out/man/
            out/completions/
            out/THIRD_PARTY_LICENSES
          if-no-files-found: error
          overwrite: true # Re-run all jobs uploads it again
          retention-days: 7

  # The GUI's Linux packages, built as make gui-packages builds them, and
  # their SBOMs (ADR 0013): cold, with generate's Go, and under the rules
  # of generate, since the build runs third-party code (miqt's C++, nfpm,
  # syft, the build images): the guard first, no credentials. gui-check
  # and the release job check what it uploads.
  gui-linux:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.gui.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-guard.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.generate.outputs.go-version }}
          check-latest: false
          cache: false
      - name: Go is generate's
        env:
          GO_VERSION: ${{ needs.generate.outputs.go-version }}
        run: test "$(go env GOVERSION)" = "go$GO_VERSION"
      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      # The tag as the version, as GoReleaser takes it
      # (GORELEASER_CURRENT_TAG): the gosftpd in each package is dist's.
      - name: make gui-packages, and the SBOMs
        env:
          VERSION: ${{ github.ref_name }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          make gui-packages
          packaging/gui/sboms.sh out/gui "$VERSION"
      - id: gui
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-linux
          path: |
            out/gui/*.deb
            out/gui/*.rpm
            out/gui/*.pkg.tar.zst
            out/gui/*.sbom.json
          if-no-files-found: error
          overwrite: true # Re-run all jobs uploads it again
          retention-days: 7

  # Takes gosftpd out of each GUI package, as the package installs it, and
  # compares it with gosftpd built here as GoReleaser builds it, byte for
  # byte (ADR 0013). It parses the packages, which gui-linux wrote, with
  # dpkg-deb, rpm2cpio, cpio, tar and zstd: never in the release job, which
  # holds the signing identity, and before GoReleaser signs or uploads
  # anything. The release job compares dist's binary with this one's
  # SHA-256. It runs no third-party code: build.sh with GOSFTPD_ONLY builds
  # gosftpd alone, from a clean clone, after go mod download.
  gui-check:
    needs: [generate, gui-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      gosftpd-sha256: ${{ steps.gosftpd.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-guard.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.generate.outputs.go-version }}
          check-latest: false
          cache: false
      - name: Go is generate's
        env:
          GO_VERSION: ${{ needs.generate.outputs.go-version }}
        run: test "$(go env GOVERSION)" = "go$GO_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.gui-linux.outputs.artifact-id }}
          path: ${{ runner.temp }}/gui-linux
      - id: gosftpd
        name: The GUI's packages carry gosftpd as GoReleaser builds it
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          .github/scripts/release-gui.sh check "$RUNNER_TEMP/gui-linux" "$RUNNER_TEMP/gui" "$GITHUB_REF_NAME"
          GOSFTPD_ONLY=1 packaging/gui/build.sh
          .github/scripts/release-gui.sh gosftpd "$RUNNER_TEMP/gui" out/gui/gosftpd
          echo "sha256=$(sha256sum <out/gui/gosftpd | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

  release:
    needs: [generate, gui-linux, gui-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the draft release and its assets
      packages: write # ghcr.io/o-kolomoiets/gosftpd
      id-token: write # keyless cosign and actions/attest
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Again: re-running only this job reuses the generate job's success.
      - name: Release guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-guard.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.generate.outputs.go-version }}
          check-latest: false
          cache: false
      - name: Go is generate's
        env:
          GO_VERSION: ${{ needs.generate.outputs.go-version }}
        run: test "$(go env GOVERSION)" = "go$GO_VERSION"
      # Never into the checkout: release-out.sh checks the files first.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.out-artifact-id }}
          path: ${{ runner.temp }}/generated
      # The generated files, checked against the exact list, in a new out/
      # with the image's empty directories made here; the modules as go.sum
      # has them; a clean tree (out/ is ignored), since GoReleaser runs
      # with --skip=before; and the release notes from CHANGELOG.md.
      - name: out/, the modules, the tree and the release notes
        run: |
          .github/scripts/release-out.sh "$RUNNER_TEMP/generated" out
          go mod tidy -diff
          go mod verify
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then echo "::error::the tree is not clean"; echo "$changed"; exit 1; fi
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      # The GUI's packages and SBOMs that gui-check checked (by the
      # artifact's id), checked against the exact list of the tag, in a new
      # directory that GoReleaser lists in checksums.txt and uploads
      # (GUI_DIR, .goreleaser.yaml's extra_files). Their names only: the
      # packages are never parsed here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.gui-linux.outputs.artifact-id }}
          path: ${{ runner.temp }}/gui-linux
      - name: The GUI's files
        run: .github/scripts/release-gui.sh check "$RUNNER_TEMP/gui-linux" "$RUNNER_TEMP/gui" "$GITHUB_REF_NAME"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      # BuildKit pinned by digest: the default builder image is a floating
      # tag, and this container builds and pushes the image that is signed.
      # No QEMU: the Dockerfile has no RUN.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GORELEASER_CURRENT_TAG: the tag the guard checked. On its own
      # GoReleaser takes the highest tag on HEAD in git's version sort,
      # which can be a tag the guard does not count, such as v0.9.0-dev
      # (git.prerelease_suffix already ranks a final above its rc).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --skip=before --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GUI_DIR: ${{ runner.temp }}/gui
      # After the push, so a check rather than the fix: it stops the run
      # before the attestations, the verification and latest.
      - name: GoReleaser built the dispatched tag
        run: |
          built="$(jq -r .tag dist/metadata.json)"
          if [ "$built" != "$GITHUB_REF_NAME" ]; then echo "::error::GoReleaser built $built, not $GITHUB_REF_NAME"; exit 1; fi
      # Also before the attestations: dist's Linux amd64 gosftpd is the one
      # gui-check found in each GUI package, checksums.txt lists every GUI
      # file (an extra_files glob that matches nothing passes), and the
      # draft holds exactly these GUI files.
      - name: The GUI's packages carry dist's gosftpd, and checksums.txt and the draft list them
        env:
          GOSFTPD_SHA256: ${{ needs.gui-check.outputs.gosftpd-sha256 }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dist=$(sha256sum <dist/gosftpd_linux_amd64_v1/gosftpd | cut -d' ' -f1)
          if [ "$dist" != "$GOSFTPD_SHA256" ]; then echo "::error::dist's gosftpd is $dist, the GUI packages' $GOSFTPD_SHA256"; exit 1; fi
          .github/scripts/release-gui.sh checksums "$RUNNER_TEMP/gui" dist/checksums.txt
          gh release download "$GITHUB_REF_NAME" -p 'gosftpd-gui*' -D "$RUNNER_TEMP/draft-gui"
          diff <(cd "$RUNNER_TEMP/gui" && sha256sum -- *) <(cd "$RUNNER_TEMP/draft-gui" && sha256sum -- *)
      # SLSA build provenance, in two steps: the action takes one subject
      # input. No storage records: they need push-to-registry and an
      # organization (ADR 0012).
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/digests.txt
          create-storage-record: false
      # The provenance of the files as gosftpd_X.Y.Z.intoto.jsonl, which gh
      # attestation verify --bundle reads without the attestations API, and
      # digests.txt, which GoReleaser writes but does not upload.
      - name: The provenance bundle and digests.txt on the draft
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          intoto="$RUNNER_TEMP/gosftpd_${GITHUB_REF_NAME#v}.intoto.jsonl"
          cp "$BUNDLE" "$intoto"
          gh release upload "$GITHUB_REF_NAME" "$intoto" dist/digests.txt
      # The verify block of docs/install.md against dist/ and the pushed
      # image, with the literal identities: a wrong identity, a broken
      # signature or attestation, or a digest that cannot be pulled fails
      # here, before latest moves and before the owner publishes.
      - name: The documented verification
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: V="${GITHUB_REF_NAME#v}" ../test/docs/run-block.sh verify
      # Only a stable version, and only the digest just verified: with one
      # source and no annotations, imagetools create copies the index as it
      # is, so latest names the signed and attested digest. The guard again
      # first: a tag made while this run was in progress makes this one no
      # longer the highest, and latest is left to that tag's run.
      - name: latest names the verified image
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/release-guard.sh
          repo=ghcr.io/o-kolomoiets/gosftpd
          digest="$(awk -v t="$repo:$GITHUB_REF_NAME" '$2 == t { print $1 }' dist/digests.txt)"
          if ! [[ $digest =~ ^[0-9a-f]{64}$ ]]; then echo "::error::digests.txt has no digest of $repo:$GITHUB_REF_NAME"; exit 1; fi
          docker buildx imagetools create --tag "$repo:latest" "$repo@sha256:$digest"
          latest="$(docker buildx imagetools inspect "$repo:latest" --format '{{json .Manifest}}' | jq -r .digest)"
          if [ "$latest" != "sha256:$digest" ]; then echo "::error::latest names $latest, not sha256:$digest"; exit 1; fi
